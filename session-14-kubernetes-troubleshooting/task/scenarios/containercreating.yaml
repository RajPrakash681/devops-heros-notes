# Stuck in ContainerCreating: mounts a ConfigMap that does not exist.
apiVersion: v1
kind: Pod
metadata:
  name: fail-6-containercreating-pod
  labels: {tier: triage-gauntlet, scenario: containercreating}
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - name: site-config
          mountPath: /etc/nginx/conf.d
  volumes:
    - name: site-config
      configMap:
        name: site-config
