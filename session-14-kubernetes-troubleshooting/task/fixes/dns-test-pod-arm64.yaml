# The course dns-test pod uses registry.k8s.io/e2e-test-images/dnsutils:1.3,
# which does not exist (the real image is jessie-dnsutils:1.3). busybox has
# nslookup and wget, which the later scenarios also need, so it is used here.
apiVersion: v1
kind: Pod
metadata:
  name: dns-test
spec:
  containers:
    - name: dns-test
      image: busybox:1.36
      command: ["sleep", "3600"]
