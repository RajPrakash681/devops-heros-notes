# Scenario 1 fixed: DATABASE_URL supplied AND the process keeps running.
# With restartPolicy Always, a container that exits - even with code 0 - is
# restarted, and repeated exits become CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels: {tier: triage-gauntlet, scenario: crashloop}
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - {name: DATABASE_URL, value: "postgresql://postgres-db.production.svc.cluster.local:5432/app"}
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!", flush=True)
          while True:            # a service stays up; it does not return
              time.sleep(60)
