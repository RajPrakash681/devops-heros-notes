# Same three-node shape as session 9 (1 control plane + 2 workers), plus what
# sessions 11-15 need on top:
#  - ingress-ready=true and host ports 80/443 on the control plane, so the
#    ingress-nginx controller (session 12) is reachable from the Mac
#  - host port 30080 for the NodePort demo (session 11)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-heros
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
