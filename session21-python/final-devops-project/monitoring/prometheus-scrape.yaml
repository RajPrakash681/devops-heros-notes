# Scrape job for a plain Prometheus (prometheus-community/prometheus chart, `kubernetes-pods`
# job). The backend pods already carry the annotations it looks for:
#   prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics
# Not installed in this submission - see README, Monitoring.
server:
  retention: 6h
  resources: {requests: {cpu: 50m, memory: 200Mi}, limits: {memory: 400Mi}}
alertmanager: {enabled: false}
prometheus-pushgateway: {enabled: false}
prometheus-node-exporter: {enabled: false}
