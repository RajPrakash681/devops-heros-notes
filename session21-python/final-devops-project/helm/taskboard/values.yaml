# Image tags are deliberately empty: every install must say which commit it deploys
# (CI passes the git SHA). There is no `latest`.
backend:
  image: ghcr.io/rajprakash681/devops-heros-notes/taskboard-backend
  tag: ""
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
frontend:
  image: ghcr.io/rajprakash681/devops-heros-notes/taskboard-frontend
  tag: ""
  replicas: 2
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 64Mi}
imagePullPolicy: IfNotPresent
imagePullSecrets: []

config:            # -> ConfigMap taskboard-config
  appEnv: dev
postgres:
  database: taskboard
  username: taskboard
  password: taskboard-dev-only   # -> Secret taskboard-db. Use existingSecret outside dev.
  existingSecret: ""
  storage: 1Gi
  storageClass: ""               # "" = cluster default (local-path on kind, gp3 on EKS)

ingress:
  enabled: true
  className: nginx
  host: taskboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
