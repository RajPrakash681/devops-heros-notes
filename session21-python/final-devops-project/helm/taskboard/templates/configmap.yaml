apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-config
  labels: {{- include "taskboard.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  DB_HOST: taskboard-postgres
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  BACKEND_URL: http://taskboard-backend:8000
