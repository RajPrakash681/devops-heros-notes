{{- $secret := .Values.postgres.existingSecret | default "taskboard-db" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taskboard-postgres-data
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-postgres
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two postgres pods must never share one data directory.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: taskboard-postgres}}
  template:
    metadata:
      labels: {app: taskboard-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: taskboard-config, key: DB_NAME}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: {{ $secret }}, key: DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ $secret }}, key: DB_PASSWORD}}}
            # A subdirectory: on EBS the volume root contains lost+found and initdb refuses it.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe: {exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, periodSeconds: 5}
          livenessProbe: {exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 20, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: taskboard-postgres-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-postgres
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector: {app: taskboard-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
