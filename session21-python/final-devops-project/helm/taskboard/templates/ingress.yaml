{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  labels: {{- include "taskboard.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: taskboard-backend, port: {name: http}}}}
          - {path: /docs, pathType: Prefix, backend: {service: {name: taskboard-backend, port: {name: http}}}}
          - {path: /openapi.json, pathType: Exact, backend: {service: {name: taskboard-backend, port: {name: http}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: taskboard-frontend, port: {name: http}}}}
{{- end }}
