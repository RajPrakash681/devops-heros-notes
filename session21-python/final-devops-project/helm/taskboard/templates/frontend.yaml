apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  labels:
    app: taskboard-frontend
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: {matchLabels: {app: taskboard-frontend}}
  template:
    metadata:
      labels: {app: taskboard-frontend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ required "frontend.tag is required (use the git SHA)" .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: BACKEND_URL
              valueFrom: {configMapKeyRef: {name: taskboard-config, key: BACKEND_URL}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  labels:
    app: taskboard-frontend
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector: {app: taskboard-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
