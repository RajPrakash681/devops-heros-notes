# Run from this folder:  docker compose up --build   ->  http://localhost:3000
name: taskboard
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: taskboard, POSTGRES_USER: taskboard, POSTGRES_PASSWORD: taskboard-dev-only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"], interval: 3s, retries: 20}
  migrate:
    build: {context: ../application/backend, dockerfile: ../../docker/backend.Dockerfile}
    image: taskboard-backend:compose
    command: ["alembic", "upgrade", "head"]
    environment: &db {DB_HOST: postgres, DB_NAME: taskboard, DB_USER: taskboard, DB_PASSWORD: taskboard-dev-only, APP_ENV: compose}
    depends_on: {postgres: {condition: service_healthy}}
  backend:
    image: taskboard-backend:compose
    environment: *db
    depends_on: {migrate: {condition: service_completed_successfully}}
    ports: ["8000:8000"]
  frontend:
    build: {context: ../application/frontend, dockerfile: ../../docker/frontend.Dockerfile}
    image: taskboard-frontend:compose
    environment: {BACKEND_URL: "http://backend:8000"}
    depends_on: [backend]
    ports: ["3000:8080"]
volumes:
  postgres-data:
