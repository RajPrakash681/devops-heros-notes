# Argo CD Application for TaskBoard (applied on the kind cluster, see README, GitOps).
# Argo CD renders the Helm chart from this repo path with the image tags pinned in
# values-gitops.yaml, syncs every new commit on main, and reverts manual changes.
#   kubectl apply -f gitops/argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RajPrakash681/devops-heros-notes.git
    targetRevision: main
    path: session21-python/final-devops-project/helm/taskboard
    helm:
      valueFiles:
        - ../../gitops/values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: taskboard
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
