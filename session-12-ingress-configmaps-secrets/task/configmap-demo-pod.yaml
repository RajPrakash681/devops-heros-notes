# Consumes the course ConfigMap (../01-configmap/app-config.yaml) both ways:
# as environment variables (envFrom) and as files (a volume).
apiVersion: v1
kind: Pod
metadata:
  name: cm-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      envFrom:
        - configMapRef:
            name: yatri-app-config
      volumeMounts:
        - name: config
          mountPath: /etc/app-config
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: yatri-app-config
