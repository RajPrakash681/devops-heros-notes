# Consumes the course Secret (../02-secret/db-secret.yaml): two keys as
# environment variables, and the whole Secret as files.
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_DB
      volumeMounts:
        - name: db-secret
          mountPath: /etc/db-secret
          readOnly: true
  volumes:
    - name: db-secret
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400
