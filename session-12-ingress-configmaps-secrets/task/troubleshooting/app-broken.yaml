# The application's copy of the credentials, hand-written the way the course's
# troubleshooting note describes:  echo "mypassword" | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-db-credentials
type: Opaque
data:
  PGUSER: eWF0cmlfYWRtaW4=          # echo -n "yatri_admin" | base64
  PGPASSWORD: bXlwYXNzd29yZAo=      # echo "mypassword" | base64   <- no -n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-client
spec:
  replicas: 1
  selector:
    matchLabels: {app: db-client}
  template:
    metadata:
      labels: {app: db-client}
    spec:
      containers:
        - name: client
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: app-db-credentials
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGDATABASE, value: yatri}
          # Try to connect every 5s and log the result.
          command: ["sh", "-c", "while true; do psql -tAc \"select 'connected as ' || current_user\" 2>&1; sleep 5; done"]
