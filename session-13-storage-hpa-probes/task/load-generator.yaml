# Load generator for the HPA demo: busybox pods hammering a Service in a tight
# loop. Scale it (kubectl scale deploy/load-generator --replicas=N) to change
# the load; delete it to stop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: load
          image: busybox:1.36
          env:
            - name: TARGET
              value: http://hpa-demo-service
          command: ["sh", "-c", "while true; do wget -q -O /dev/null $TARGET; done"]
          resources:
            requests: {cpu: 50m}
