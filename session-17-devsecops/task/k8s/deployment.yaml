apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-dashboard
  labels:
    app: devsecops-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-dashboard
  template:
    metadata:
      labels:
        app: devsecops-dashboard
    spec:
      # Deploy-time controls, the last layer after the pipeline's scans:
      # the pod is refused if the image tries to run as root.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replaced by the deploy job with the exact image the gate approved.
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp            # gunicorn needs a writable /tmp for worker heartbeats
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
      volumes:
        - name: tmp
          emptyDir: {}
